  function discoverPage(){const q=globalSearch.toLowerCase();const people=state.chats.filter(c=>!c.blocked&&!c.request&&(c.name.toLowerCase().includes(q)||c.handle.toLowerCase().includes(q)));const products=state.products.filter(p=>(p.name+' '+p.category+' '+p.location+' '+p.seller).toLowerCase().includes(q)&&p.status==='published');const services=state.services.filter(s=>s.status==='published'&&(s.name+' '+s.category+' '+s.provider+' '+s.location).toLowerCase().includes(q));return `${head('DISCOVER','Find your next connection','Search across people, products, stores and local services. Select a result to open its native TwinCercle action.',`<button class="btn" data-action="clear-search">${I('close')} Clear search</button>`)}<div class="filterbar"><input class="field" id="discoverSearch" aria-label="Search people, products and services" type="search" value="${escapeHtml(globalSearch)}" placeholder="Try a name, product, category or location"><button class="btn primary" data-action="run-discover">${I('search')} Search</button></div><div class="notice" style="margin-bottom:16px">${I('info',14)} Search results use the sample data and drafts stored in this browser. A production release needs server-side search, access policies and privacy-safe location handling.</div>${(!q?`<div class="grid cols-3"><div class="card card-pad"><div class="stat-icon">${I('message')}</div><h3 style="font-size:14px;margin:12px 0 4px">People</h3><p class="subtle">Find a person and start a Connect conversation.</p></div><div class="card card-pad"><div class="stat-icon">${I('store')}</div><h3 style="font-size:14px;margin:12px 0 4px">Marketplace</h3><p class="subtle">Explore local stores and product listings.</p></div><div class="card card-pad"><div class="stat-icon">${I('service')}</div><h3 style="font-size:14px;margin:12px 0 4px">Local Services</h3><p class="subtle">Find a provider by category and service area.</p></div></div>`:'')}${q?`<div class="grid cols-2"><section class="card card-pad"><div class="card-title"><h2>People <span class="tag gray">${people.length}</span></h2></div>${people.length?people.map(c=>`<div class="service-row"><div class="avatar">${initials(c.name)}</div><div class="service-info"><strong>${escapeHtml(c.name)}</strong><span>@${escapeHtml(c.handle)} · ${escapeHtml(c.context)}</span></div><button class="btn small primary" data-chat="${c.id}">Connect</button></div>`).join(''):'<div class="empty">No matching people in demo data.</div>'}</section><section class="card card-pad"><div class="card-title"><h2>Products <span class="tag gray">${products.length}</span></h2></div>${products.length?products.slice(0,5).map(p=>`<div class="service-row"><div class="service-icon">${escapeHtml(p.emoji||'📦')}</div><div class="service-info"><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.seller)} · ${escapeHtml(p.location)}</span></div><button class="btn small" data-product="${p.id}">View</button></div>`).join(''):'<div class="empty">No matching products.</div>'}</section><section class="card card-pad span-2"><div class="card-title"><h2>Local services <span class="tag gray">${services.length}</span></h2></div>${services.length?services.map(providerRow).join(''):'<div class="empty">No matching services.</div>'}</section></div>`:''}`}
  function connectPage(){const requests=state.chats.filter(c=>c.request&&!c.blocked);const chats=state.chats.filter(c=>!c.request&&!c.blocked);const chosen=state.chats.find(c=>c.id===selectedChatId&&!c.request&&!c.blocked)||chats[0];const isOpen=mobileChatOpen;return `${head('NATIVE COMMUNICATION','Connect','One-to-one conversation workspace. Marketplace and Local Services contact actions arrive here with their listing or provider context.',`<button class="btn primary" data-action="new-chat">${I('plus')} New conversation</button>`)}<div class="notice" style="margin-bottom:14px"><strong>Demo boundary:</strong> Messages are stored in this browser only. There is no live delivery, XMTP/Waku connection, end-to-end encryption or server-side message store in this prototype.</div><div class="card chat-layout ${isOpen?'mobile-chat-open':''}" id="connectLayout"><aside class="chat-list"><div class="chat-list-head"><div style="display:flex;align-items:center;justify-content:space-between"><strong style="font-size:14px">Conversations</strong><span class="tag gray">${chats.length}</span></div><input class="field" id="chatSearch" placeholder="Search conversations" style="height:36px;margin-top:10px"></div>${requests.length?`<div style="padding:12px 15px 4px;font-size:10px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:.8px">Message requests · ${requests.length}</div>${requests.map(c=>`<div class="chat-person"><div class="avatar sm">${initials(c.name)}</div><div class="profile-meta"><strong>${escapeHtml(c.name)}</strong><span>Wants to connect</span></div><span class="tag amber">Request</span></div><div style="padding:0 13px 10px;display:flex;gap:6px"><button class="btn small primary" data-accept="${c.id}">Accept</button><button class="btn small" data-decline="${c.id}">Decline</button></div>`).join('')}`:''}${chats.map(c=>`<button class="chat-person ${chosen?.id===c.id?'selected':''}" data-chat="${c.id}"><div class="avatar sm">${initials(c.name)}</div><div class="profile-meta"><strong>${escapeHtml(c.name)}</strong><span>${escapeHtml(c.messages.at(-1)?.body||c.context)}</span></div>${c.unread?`<span class="tag">${c.unread}</span>`:''}</button>`).join('')||'<div class="empty">No conversations yet. Start one from a person, product or service.</div>'}</aside><section class="chat-main">${chosen?`<div class="chat-head"><button class="btn small chat-top-mobile" data-action="chat-back">${I('arrow',14)} Back</button><div class="avatar sm">${initials(chosen.name)}</div><div class="profile-meta"><strong>${escapeHtml(chosen.name)}</strong><span>${escapeHtml(chosen.context)} · Demo conversation</span></div><button class="icon-btn" data-action="chat-menu" aria-label="Conversation safety">${I('more')}</button></div><div class="chat-stream" id="chatStream">${chosen.messages.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${escapeHtml(m.body)}<small>${escapeHtml(m.time)} · ${m.from==='me'?'You':'Demo contact'}</small></div>`).join('')}</div><form class="chat-compose" id="sendMessageForm"><textarea name="body" required maxlength="2000" placeholder="Write a message…" aria-label="Message"></textarea><button class="btn primary" type="submit" aria-label="Send demo message">${I('send')}<span class="desktop-only">Send</span></button></form><div style="padding:0 14px 12px;color:var(--muted-2);font-size:9px">Browser-local draft interaction · Do not send sensitive or real personal information in this demo.</div>`:`<div class="empty" style="margin:auto"><div class="empty-icon">${I('message')}</div><strong>Select a conversation</strong><p>Choose a conversation or open a seller/provider profile to start one.</p></div>`}</section></div>`}
  function marketplacePage(){const q=globalSearch.toLowerCase();let list=state.products.filter(p=>p.status==='published'&&(currentProductFilter==='All'||(currentProductFilter==='Saved'?state.saved.includes(p.id):p.category===currentProductFilter))&&(currentMarketLocation==='all'||p.location===currentMarketLocation)&&(p.name+' '+p.category+' '+p.location+' '+p.seller).toLowerCase().includes(q));const cats=['All','Saved',...new Set(state.products.filter(p=>p.status==='published').map(p=>p.category))];return `${head('LOCAL & NATIONAL DISCOVERY','Marketplace','Discover independent stores and product listings. TwinCercle is the discovery and communication layer—not the seller, courier, payment holder or escrow service.',`<button class="btn" data-nav="business">Manage business</button><button class="btn primary" data-action="new-product">${I('plus')} List a product</button>`)}<div class="filterbar"><input class="field" id="marketSearch" aria-label="Search marketplace listings" type="search" value="${escapeHtml(globalSearch)}" placeholder="Search products, stores or categories"><select class="select" id="marketLocation" aria-label="Filter marketplace by location"><option value="all">All locations</option><option ${currentMarketLocation==='Kuala Lumpur, Malaysia'?'selected':''}>Kuala Lumpur, Malaysia</option><option ${currentMarketLocation==='Petaling Jaya, Malaysia'?'selected':''}>Petaling Jaya, Malaysia</option><option ${currentMarketLocation==='Shah Alam, Malaysia'?'selected':''}>Shah Alam, Malaysia</option><option ${currentMarketLocation==='Dhaka, Bangladesh'?'selected':''}>Dhaka, Bangladesh</option></select><button class="btn primary" data-action="run-market">${I('search')} Search</button></div><div style="display:flex;align-items:center;gap:7px;overflow-x:auto;padding:1px 0 13px;margin-bottom:4px">${cats.map(c=>`<button class="btn small ${currentProductFilter===c?'primary':''}" data-product-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><div class="notice" style="margin-bottom:15px"><strong>How it works:</strong> Buyers and sellers agree on availability, final price, delivery and payment directly. Delivery time is an estimate only. No checkout or escrow is available in this prototype.</div><div class="card card-pad" style="margin-bottom:15px"><div class="card-title"><div><h2>${list.length} listings</h2><div class="subtle">Illustrative sample data and your locally saved drafts</div></div><span class="tag amber">Demo inventory</span></div><div class="listing-grid" id="marketGrid">${list.map(productCard).join('')||'<div class="empty" style="grid-column:1/-1"><div class="empty-icon">'+I('search')+'</div><strong>No listings match your filters</strong><p>Try a different search or category.</p></div>'}</div></div><div class="grid cols-2"><div class="notice"><strong>Seller responsibility</strong><br>Seller owns the listing, stock, product description, price and delivery agreement.</div><div class="notice"><strong>TwinCercle responsibility</strong><br>Discovery, identity context, native messaging and platform safety workflows—subject to real backend implementation.</div></div>`}
  function servicesPage(){const q=globalSearch.toLowerCase();let list=state.services.filter(s=>s.status==='published'&&(currentServiceFilter==='All'||s.category===currentServiceFilter)&&(currentServiceArea==='all'||s.location===currentServiceArea)&&(s.name+' '+s.category+' '+s.location+' '+s.provider).toLowerCase().includes(q));const cats=['All',...new Set(state.services.filter(s=>s.status==='published').map(s=>s.category))];return `${head('COMMUNITY SERVICES','Local Services','Find nearby service providers, review their listed coverage and discuss the job directly through TwinCercle Connect.',`<button class="btn" data-nav="business">Provider workspace</button><button class="btn primary" data-action="new-service">${I('plus')} Offer a service</button>`)}<div class="filterbar"><input class="field" id="serviceSearch" aria-label="Search local services" type="search" value="${escapeHtml(globalSearch)}" placeholder="Search service or provider"><select class="select" id="serviceArea" aria-label="Filter services by area"><option value="all">All areas</option><option ${currentServiceArea==='Kuala Lumpur, Malaysia'?'selected':''}>Kuala Lumpur, Malaysia</option><option ${currentServiceArea==='Petaling Jaya, Malaysia'?'selected':''}>Petaling Jaya, Malaysia</option><option ${currentServiceArea==='Shah Alam, Malaysia'?'selected':''}>Shah Alam, Malaysia</option><option ${currentServiceArea==='Dhaka, Bangladesh'?'selected':''}>Dhaka, Bangladesh</option></select><button class="btn primary" data-action="run-services">${I('search')} Search</button></div><div style="display:flex;gap:7px;overflow:auto;padding-bottom:13px">${cats.map(c=>`<button class="btn small ${currentServiceFilter===c?'primary':''}" data-service-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div><div class="notice warning" style="margin-bottom:15px"><strong>Service safety:</strong> Medical, financial, legal, childcare, transport and other regulated/high-risk categories are not enabled in this prototype and require separate compliance approval. Verify scope, pricing and provider suitability before arranging work.</div><div class="card card-pad"><div class="card-title"><div><h2>${list.length} providers and services</h2><div class="subtle">All names, rates, coverage and availability are illustrative</div></div><span class="tag amber">Demo profiles</span></div>${list.length?list.map(s=>providerRow(s)).join(''):'<div class="empty"><div class="empty-icon">'+I('service')+'</div><strong>No services match your filters</strong><p>Try another category or search term.</p></div>'}</div>`}
  function businessPage(){const myProducts=state.products.filter(p=>p.ownerDraft);const myServices=state.services.filter(s=>s.ownerDraft);const business=state.businessDraft;const provider=state.providerDraft;return `${head('BUSINESS WORKSPACE','Business & Trust','Create a seller or service-provider presence. Ownership stays with the business/provider; verification and public activation require a real review process.',`<button class="btn" data-action="new-service">${I('plus')} Add service</button><button class="btn primary" data-action="new-business">${I('plus')} Create business</button>`)}<div class="business-banner"><div><div class="eyebrow" style="color:#91dbff">YOUR BUSINESS PRESENCE</div><h2>${escapeHtml(business?.name||'Set up your business profile')}</h2><p>${business?'Local demo draft · Not publicly verified':'Bring products, services and customer conversations into one workspace.'}</p></div><button class="btn" data-action="new-business">${business?'Edit business profile':'Create a business profile'}</button></div><div class="grid cols-3 section-gap"><div class="card card-pad"><div class="card-title"><h3>Seller profile</h3><span class="tag ${business?'amber':'gray'}">${business?'Draft':'Not started'}</span></div><p class="subtle">Store identity, category, location, description and listing ownership.</p><button class="btn small" data-action="new-business">${business?'Edit profile':'Set up seller'}</button></div><div class="card card-pad"><div class="card-title"><h3>Service provider</h3><span class="tag ${provider?'amber':'gray'}">${provider?'Draft':'Not started'}</span></div><p class="subtle">Provider details, approved service categories and coverage area.</p><button class="btn small" data-action="new-provider">${provider?'Edit provider':'Set up provider'}</button></div><div class="card card-pad"><div class="card-title"><h3>Verification</h3><span class="tag amber">Not verified</span></div><p class="subtle">The demo does not collect ID documents or biometric data. Real verification needs an approved provider and policy.</p><button class="btn small" data-action="verification-info">Review requirements</button></div></div><div class="grid cols-2 section-gap"><section class="card card-pad"><div class="card-title"><div><h2>Your product drafts</h2><div class="subtle">Stored only in this browser</div></div><button class="link-btn" data-action="new-product">Add product</button></div>${myProducts.length?myProducts.map(p=>`<div class="service-row"><div class="service-icon">${p.emoji||'📦'}</div><div class="service-info"><strong>${escapeHtml(p.name)}</strong><span>${escapeHtml(p.category)} · ${money(p.price,p.currency)}</span></div><span class="tag amber">Local draft</span></div>`).join(''):'<div class="empty"><strong>No product drafts yet</strong><p>Create a draft listing to preview seller workflows.</p></div>'}</section><section class="card card-pad"><div class="card-title"><div><h2>Your service drafts</h2><div class="subtle">Stored only in this browser</div></div><button class="link-btn" data-action="new-service">Add service</button></div>${myServices.length?myServices.map(s=>`<div class="service-row"><div class="service-icon">${s.emoji||'🧰'}</div><div class="service-info"><strong>${escapeHtml(s.name)}</strong><span>${escapeHtml(s.category)} · ${escapeHtml(s.location)}</span></div><span class="tag amber">Local draft</span></div>`).join(''):'<div class="empty"><strong>No service drafts yet</strong><p>Create a service draft to preview provider workflows.</p></div>'}</section></div><div class="card card-pad section-gap"><div class="card-title"><h2>Trust, ownership & onboarding</h2><span class="tag gray">Policy-led</span></div><div class="activity-list"><div class="activity-item"><div class="activity-dot">${I('user')}</div><div><strong>Business ownership remains with the seller</strong><p>Partners may help prepare a draft later, but permissions must be limited, revocable and audited.</p></div></div><div class="activity-item"><div class="activity-dot">${I('shield')}</div><div><strong>Verification status explains what was checked</strong><p>A badge is not a warranty, endorsement or guarantee of product quality, safety or delivery.</p></div></div><div class="activity-item"><div class="activity-dot">${I('message')}</div><div><strong>Customer contact stays inside TwinCercle</strong><p>Seller/provider enquiries open native Connect conversations; no default WhatsApp redirect.</p></div></div></div></div>`}
  function identityPage(){return `${head('YOUR DIGITAL PRESENCE','Identity','Manage the public profile attached to your TwinCercle identity. The account and username shown here are prototype values, not an authenticated account.',`<button class="btn primary" data-action="save-profile">${I('check')} Save profile</button>`)}<div class="grid cols-2"><section class="card card-pad"><div style="display:flex;align-items:center;gap:14px;margin-bottom:20px"><div class="avatar lg">${initials(state.profile.name)}</div><div><h2 style="margin:0;font-size:17px">${escapeHtml(state.profile.name)}</h2><div class="subtle">@${escapeHtml(state.profile.handle)} · Demo identity</div><span class="tag gray" style="margin-top:7px">${escapeHtml(state.profile.handle)}@twincercle.com · Namespace preview</span></div></div><form id="profileForm" class="form-grid"><div class="form-field full"><label for="profileName">Display name</label><input class="field" name="name" id="profileName" required maxlength="60" value="${escapeHtml(state.profile.name)}"></div><div class="form-field"><label for="profileHandle">Username</label><input class="field" name="handle" id="profileHandle" required maxlength="24" pattern="[a-zA-Z0-9._-]+" value="${escapeHtml(state.profile.handle)}"><span class="form-note">Prototype only. Real username reservation needs server-side uniqueness and dispute controls.</span></div><div class="form-field"><label for="profileLocation">Public location</label><input class="field" name="location" id="profileLocation" maxlength="80" value="${escapeHtml(state.profile.location)}"></div><div class="form-field full"><label for="profileBio">About</label><textarea class="field" name="bio" id="profileBio" maxlength="240">${escapeHtml(state.profile.bio)}</textarea></div><div class="form-field full"><label for="profileEmail">Recovery/contact email (display only)</label><input class="field" name="email" id="profileEmail" type="email" value="${escapeHtml(state.profile.email)}"><span class="form-note">Changing this field does not verify an email address or alter account recovery.</span></div><div class="form-field full"><button class="btn primary" type="submit">Save local profile</button></div></form></section><section class="card card-pad"><div class="card-title"><h2>Identity architecture</h2><span class="tag amber">Planned security</span></div><div class="notice"><strong>Important:</strong> username@twincercle.com is a TwinCercle identity namespace. It is not a conventional SMTP mailbox unless external mail delivery is separately built.</div><div class="settings-row"><div><strong>Passkey / WebAuthn</strong><p>Authentication is not connected in this HTML prototype.</p></div><span class="tag gray">Not active</span></div><div class="settings-row"><div><strong>External wallet</strong><p>Optional for the core product; no wallet is connected here.</p></div><span class="tag gray">Not linked</span></div><div class="settings-row"><div><strong>Username availability</strong><p>Uniqueness, reserved names and recovery need server enforcement.</p></div><span class="tag amber">Design required</span></div><div class="settings-row"><div><strong>Profile discovery</strong><p>Control visibility in the privacy section.</p></div><button class="switch ${state.preferences.discoverable?'on':''}" data-pref="discoverable" aria-label="Toggle discoverability"></button></div></section></div><div class="card card-pad section-gap"><div class="card-title"><h2>One identity, connected modules</h2><span class="tag green">Product principle</span></div><div class="grid cols-3"><div class="notice"><strong>Connect</strong><br>One identity for conversations and message requests.</div><div class="notice"><strong>Marketplace</strong><br>Seller/business profiles are linked to their owner.</div><div class="notice"><strong>Local Services</strong><br>Provider profiles remain accountable to their owners.</div></div></div>`}
  function notificationsPage(){return `${head('YOUR ACTIVITY','Notifications','Privacy-conscious notification preferences and in-browser demo activity. No push notification service is connected.',`<button class="btn" data-action="read-notifications">${I('check')} Mark all read</button>`)}<div class="grid cols-2"><section class="card card-pad"><div class="card-title"><h2>Recent activity</h2><span class="tag gray">${state.notifications.length}</span></div>${state.notifications.map(n=>`<div class="service-row"><div class="activity-dot">${I('bell')}</div><div class="service-info"><strong>${escapeHtml(n.title)}</strong><span>${escapeHtml(n.body)}</span><div class="subtle" style="margin-top:4px">${escapeHtml(n.time)}</div></div>${n.read?'<span class="tag gray">Read</span>':'<span class="tag">New</span>'}</div>`).join('')}</section><section class="card card-pad"><div class="card-title"><h2>Notification preferences</h2></div>${[['productUpdates','Product and marketplace updates','Listing and product activity'],['securityAlerts','Security alerts','Sensitive identity and account events']].map(([id,label,desc])=>`<div class="settings-row"><div><strong>${label}</strong><p>${desc}</p></div><button class="switch ${state.preferences[id]?'on':''}" data-pref="${id}" aria-label="Toggle ${label}"></button></div>`).join('')}<div class="notice section-gap">Push tokens and message contents must not be exposed in notification payloads by default. These switches are local preferences only.</div></section></div>`}
  function securityPage(){return `${head('PROTECT YOUR ACCOUNT','Security & devices','Review the security model and device controls planned for TwinCercle. The controls below explain requirements; they do not enroll a passkey or revoke a real session.',`<button class="btn" data-action="reset-demo">${I('refresh')} Reset demo</button><button class="btn" data-action="security-info">${I('info')} Security notes</button>`)}<div class="grid cols-2"><section class="card card-pad"><div class="card-title"><h2>Authentication</h2><span class="tag amber">Not connected</span></div><div class="settings-row"><div><strong>Passkey-first sign-in</strong><p>Requires a WebAuthn server relying-party configuration and registration flow.</p></div><span class="tag gray">Planned</span></div><div class="settings-row"><div><strong>Step-up authentication</strong><p>Required for recovery changes, wallet unlinking and sensitive admin actions.</p></div><span class="tag gray">Planned</span></div><div class="settings-row"><div><strong>Recovery methods</strong><p>At least two independent recovery paths should be encouraged where practical.</p></div><span class="tag gray">Design gate</span></div><div class="notice warning section-gap">The server must not have a hidden recovery bypass. Loss of all recovery material may make encrypted history unrecoverable.</div></section><section class="card card-pad"><div class="card-title"><h2>Device management</h2><span class="tag gray">Sample devices</span></div>${[['Current browser','This browser · demo session'],['Mobile device','Example phone · illustrative only']].map((d,i)=>`<div class="service-row"><div class="service-icon">${I(i?'phone':'globe')}</div><div class="service-info"><strong>${d[0]}</strong><span>${d[1]}</span></div><span class="tag ${i?'gray':'green'}">${i?'Example':'Current demo'}</span></div>`).join('')}<p class="form-note" style="margin-top:12px">No actual device inventory, token, session or revocation endpoint exists yet.</p><button class="btn small" data-action="security-info">View device security requirements</button></section></div><div class="card card-pad section-gap"><div class="card-title"><h2>Privacy baseline</h2></div><div class="grid cols-3"><div class="notice"><strong>No seed phrases</strong><br>Never request or store a user's wallet recovery phrase.</div><div class="notice"><strong>No message shadow copy</strong><br>Do not store plaintext copies when the selected protocol owns message persistence.</div><div class="notice"><strong>Safe notifications</strong><br>Do not include message bodies or sensitive sender details in push payloads.</div></div></div>`}
  function operationsPage(){return `${head('INTERNAL TRUST WORKFLOWS','Operations preview','A visual preview of the moderation and verification queues described in the Master Context. This screen is not an authenticated admin console and performs no privileged backend action.',`<span class="tag amber">Demo data only</span>`)}<div class="notice warning" style="margin-bottom:16px"><strong>Access control is not implemented.</strong> Do not expose this screen publicly in a production app. Real operations must enforce server-side role checks, step-up authentication, audit events and least-privilege access.</div><div class="grid cols-4"><div class="card stat-card"><div class="stat-icon">${I('shield')}</div><div><div class="num">2</div><div class="label">Verification examples</div></div></div><div class="card stat-card"><div class="stat-icon">${I('flag')}</div><div><div class="num">1</div><div class="label">Report example</div></div></div><div class="card stat-card"><div class="stat-icon">${I('users')}</div><div><div class="num">0</div><div class="label">Suspended accounts</div></div></div><div class="card stat-card"><div class="stat-icon">${I('file')}</div><div><div class="num">0</div><div class="label">Audit actions today</div></div></div></div><div class="grid cols-2 section-gap"><section class="card card-pad"><div class="card-title"><h2>Verification review queue</h2><span class="tag amber">Sample entries</span></div><div class="service-row"><div class="avatar sm">NS</div><div class="service-info"><strong>Northstar Home Studio</strong><span>Business verification · Review not submitted</span></div><span class="tag gray">Draft</span></div><div class="service-row"><div class="avatar sm">AR</div><div class="service-info"><strong>Arif Home Solutions</strong><span>Provider verification · Review not submitted</span></div><span class="tag gray">Draft</span></div><p class="form-note">No identity documents, selfies or biometric samples are collected by this prototype.</p></section><section class="card card-pad"><div class="card-title"><h2>Reports & moderation</h2><span class="tag gray">Illustrative</span></div>${state.reports.length?state.reports.map(r=>`<div class="service-row"><div class="service-info"><strong>${escapeHtml(r.target)}</strong><span>${escapeHtml(r.reason)} · ${escapeHtml(r.status)}</span></div><span class="tag amber">Local report</span></div>`).join(''):'<div class="empty"><strong>No demo reports submitted</strong><p>Reporting from listing and conversation views will appear here in this browser only.</p></div>'}</section></div><div class="card card-pad section-gap"><div class="card-title"><h2>Operations acceptance controls</h2></div><div class="grid cols-3"><div class="notice"><strong>Authorization</strong><br>Check every action against the actor, role and resource owner on the server.</div><div class="notice"><strong>Audit</strong><br>Record sanitized events for verification decisions, suspension and restoration.</div><div class="notice"><strong>Appeals</strong><br>Provide takedown, correction and appeal paths with clear status.</div></div></div>`}
  function previewPage(which){const info={mail:{title:'TwinCercle Mail',kicker:'INTERNAL COMMUNICATION · P1',desc:'An email-like internal communication experience may follow the messaging foundation.',icon:'mail',points:['Inbox, sent, drafts, archive and trash','Subject-based messages and internal recipients','Search, labels, spam/report/block controls','Client-side encrypted attachments where appropriate'],warning:'@twincercle.com is not standard SMTP email. External sending and receiving, DKIM, SPF, DMARC and abuse operations are not implemented.'},communities:{title:'Communities',kicker:'GROUP EXPERIENCES · P1/P2',desc:'Community spaces are planned after the one-to-one communication and moderation foundations.',icon:'users',points:['Small groups with clear membership and roles','Community discovery and moderation','Abuse reporting and admin oversight','Group encryption design and MLS evaluation'],warning:'No group chats, public channels or community membership system is active in this prototype.'},wallet:{title:'Wallet & Web3',kicker:'OPTIONAL WEB3 CAPABILITIES · P1/P2',desc:'Wallet connectivity should add ownership or verifiability where it provides clear user value.',icon:'wallet',points:['Optional external wallet connection','WalletConnect/Reown integration candidate','SIWE domain, nonce, chain and expiry validation','Future identity proofs where interoperability is justified'],warning:'No wallet is connected. Never enter a seed phrase or private key. The core product must remain usable without a wallet.'}}[which];return `${head(info.kicker,info.title,info.desc,`<span class="tag gray">Coming later</span>`)}<div class="card card-pad" style="max-width:850px;margin:auto"><div style="width:58px;height:58px;border-radius:17px;background:var(--surface-3);display:grid;place-items:center;color:var(--blue);margin-bottom:17px">${I(info.icon,27)}</div><h2 style="font-size:20px;margin:0 0 5px">Designed as part of one ecosystem</h2><p class="subtle" style="font-size:12px;margin:0 0 18px">This module is visible for product continuity, but its real functionality is not included in this balanced frontend MVP.</p><div class="grid cols-2">${info.points.map((p,i)=>`<div class="service-row"><div class="activity-dot">${I('check')}</div><div class="service-info"><strong>${escapeHtml(p)}</strong><span>Planned capability</span></div></div>`).join('')}</div><div class="notice warning section-gap"><strong>Current limitation:</strong><br>${escapeHtml(info.warning)}</div><div class="modal-actions"><button class="btn" data-nav="home">Back to overview</button><button class="btn primary" data-action="save-module-interest">Save as a future priority</button></div></div>`}
  let modalReturnFocus=null;
  function openModal(title,desc,body,opts={}){modalReturnFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${title}</h2><p>${desc||''}</p></div><button class="modal-close" data-action="close-modal" aria-label="Close dialog">${I('close',17)}</button></div>${body}</section></div>`;document.body.style.overflow='hidden';const first=$('input,select,textarea,button', $('#modalRoot'));first?.focus({preventScroll:true})}
  function closeModal(){if(!$('#modalRoot').firstElementChild)return;$('#modalRoot').innerHTML='';document.body.style.overflow='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true});modalReturnFocus=null}
  function newChatModal(){openModal('Start a conversation','Create a local demo conversation. This does not send an invitation to a real user.',`<form id="newChatForm"><div class="form-grid"><div class="form-field full"><label>Person name</label><input class="field" name="name" required maxlength="60" placeholder="Enter a display name"></div><div class="form-field full"><label>TwinCercle username</label><input class="field" name="handle" maxlength="24" placeholder="username"></div><div class="form-field full"><label>Conversation context (optional)</label><input class="field" name="context" maxlength="100" placeholder="What would you like to discuss?"></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Create demo conversation</button></div></form>`)}
  function newProductModal(){openModal('Create a product listing','Draft only · Listing is stored in this browser. No real publication, checkout or payment.',`<form id="productForm"><div class="form-grid"><div class="form-field full"><label>Product name</label><input class="field" name="name" required maxlength="90" placeholder="e.g. Handmade ceramic mug"></div><div class="form-field"><label>Category</label><select class="select" name="category"><option>Home & Living</option><option>Fashion</option><option>Kitchen</option><option>Electronics</option><option>Stationery</option><option>Other</option></select></div><div class="form-field"><label>Price (illustrative)</label><input class="field" name="price" type="number" min="0" max="10000000" step="1" required placeholder="0"></div><div class="form-field"><label>Currency</label><select class="select" name="currency"><option value="MYR">MYR</option><option value="BDT">BDT</option><option value="USD">USD</option></select></div><div class="form-field"><label>Location</label><input class="field" name="location" required maxlength="80" placeholder="City, country"></div><div class="form-field"><label>Estimated delivery</label><input class="field" name="delivery" maxlength="60" placeholder="Estimated 2–4 days"></div><div class="form-field"><label>Stock status</label><select class="select" name="stock"><option>Available</option><option>Limited stock</option><option>Pre-order</option><option>Ask seller</option></select></div><div class="form-field full"><label>Description</label><textarea class="field" name="description" maxlength="700" placeholder="Describe the product, condition, size and relevant details"></textarea></div><div class="form-field full"><div class="notice warning">This creates a local draft with demo ownership. A production listing needs authenticated seller ownership, content moderation, image storage and server validation.</div></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save local product draft</button></div></form>`,{wide:true})}
  function newServiceModal(){openModal('Create a service listing','Draft only · Service profiles require approval rules before public activation.',`<form id="serviceForm"><div class="form-grid"><div class="form-field full"><label>Service name</label><input class="field" name="name" required maxlength="90" placeholder="e.g. Home furniture assembly"></div><div class="form-field"><label>Category</label><select class="select" name="category"><option>Home Repair</option><option>Delivery & Errands</option><option>Personal Assistance</option><option>Other approved service</option></select></div><div class="form-field"><label>Provider/business name</label><input class="field" name="provider" required maxlength="70" placeholder="Provider display name"></div><div class="form-field"><label>Location</label><input class="field" name="location" required maxlength="80" placeholder="City, country"></div><div class="form-field"><label>Service coverage</label><input class="field" name="coverage" maxlength="60" placeholder="Within 10 km / selected areas"></div><div class="form-field"><label>Rate guidance</label><input class="field" name="rate" maxlength="60" placeholder="Quote in chat"></div><div class="form-field"><label>Availability</label><input class="field" name="availability" maxlength="60" placeholder="By arrangement"></div><div class="form-field full"><label>Description</label><textarea class="field" name="description" maxlength="700" placeholder="Scope, requirements and relevant safety details"></textarea></div><div class="form-field full"><div class="notice warning">Regulated/high-risk categories are excluded. This draft is not verified and cannot be treated as a public provider endorsement.</div></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save local service draft</button></div></form>`,{wide:true})}
  function newBusinessModal(){const b=state.businessDraft||{};openModal(b.name?'Edit business profile':'Create a business profile','A business profile remains owned by the seller. This local demo does not verify ownership.',`<form id="businessForm"><div class="form-grid"><div class="form-field full"><label>Business name</label><input class="field" name="name" required maxlength="90" value="${escapeHtml(b.name||'')}" placeholder="Your store or business name"></div><div class="form-field"><label>Business category</label><select class="select" name="category"><option>Home & Living</option><option>Fashion</option><option>Food & Beverage</option><option>Electronics</option><option>Retail</option><option>Other</option></select></div><div class="form-field"><label>Business location</label><input class="field" name="location" required maxlength="90" value="${escapeHtml(b.location||'')}" placeholder="City, country"></div><div class="form-field full"><label>About the business</label><textarea class="field" name="description" maxlength="500" placeholder="What do you offer?">${escapeHtml(b.description||'')}</textarea></div><div class="form-field full"><div class="notice">Verification documents are not requested here. A real onboarding flow must explain lawful purpose, provider, retention, access and deletion before collecting identity or business documents.</div></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save local business draft</button></div></form>`,{wide:true})}
  function newProviderModal(){const p=state.providerDraft||{};openModal(p.name?'Edit provider profile':'Create a provider profile','Draft only · No identity documents, face scans or biometric samples are collected.',`<form id="providerForm"><div class="form-grid"><div class="form-field full"><label>Provider name</label><input class="field" name="name" required maxlength="80" value="${escapeHtml(p.name||'')}" placeholder="Your provider profile name"></div><div class="form-field"><label>Approved service category</label><select class="select" name="category"><option>Home Repair</option><option>Delivery & Errands</option><option>Personal Assistance</option><option>Other approved service</option></select></div><div class="form-field"><label>Service location</label><input class="field" name="location" required maxlength="80" value="${escapeHtml(p.location||'')}" placeholder="City, country"></div><div class="form-field full"><label>About your service</label><textarea class="field" name="description" maxlength="500">${escapeHtml(p.description||'')}</textarea></div><div class="form-field full"><div class="notice warning">Provider verification and category approval must be completed by a real review process before public activation.</div></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save local provider draft</button></div></form>`,{wide:true})}
  function showProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;openModal(escapeHtml(p.name),'Product details · illustrative listing',`<div class="listing-visual" style="height:170px;border-radius:14px;font-size:58px;margin-bottom:15px">${escapeHtml(p.emoji||'📦')}</div><div class="grid cols-2"><div><div class="subtle">Price shown by seller</div><div style="font-size:22px;font-weight:850;margin-top:2px">${money(p.price,p.currency)}</div></div><div><div class="subtle">Availability</div><strong>${escapeHtml(p.stock||'Ask seller')}</strong></div></div><div class="divider"></div><div class="service-row"><div class="service-info"><strong>Store / seller</strong><span>${escapeHtml(p.seller)}</span></div><span class="tag amber">Demo profile</span></div><div class="service-row"><div class="service-info"><strong>Location</strong><span>${escapeHtml(p.location)}</span></div></div><div class="service-row"><div class="service-info"><strong>Delivery</strong><span>${escapeHtml(p.delivery||'Confirm with seller')}</span></div><span class="tag gray">Estimate only</span></div><p class="subtle" style="font-size:12px">${escapeHtml(p.description||'')}</p><div class="notice warning">TwinCercle does not own this product, guarantee its quality, provide delivery, hold buyer funds or guarantee a transaction. Agree the final price, stock, delivery and payment directly with the seller.</div><div class="modal-actions"><button class="btn" data-save="${p.id}">${I('heart')} ${state.saved.includes(p.id)?'Saved':'Save listing'}</button><button class="btn" data-report="${p.id}" data-report-target="Listing: ${escapeHtml(p.name)}">${I('report')} Report listing</button><button class="btn primary" data-message-product="${p.id}">${I('message')} Message seller</button></div>`)}
  function showService(id){const s=state.services.find(x=>x.id===id);if(!s)return;openModal(escapeHtml(s.name),'Service details · illustrative provider listing',`<div style="display:flex;align-items:center;gap:13px;margin-bottom:15px"><div class="service-icon" style="width:58px;height:58px;font-size:28px">${escapeHtml(s.emoji||'🧰')}</div><div><strong style="font-size:15px">${escapeHtml(s.provider)}</strong><div class="subtle">${escapeHtml(s.location)}</div><span class="tag amber">Demo provider · Not verified</span></div></div><div class="grid cols-2"><div class="notice"><strong>Rate guidance</strong><br>${escapeHtml(s.rate)}</div><div class="notice"><strong>Coverage</strong><br>${escapeHtml(s.coverage||'To confirm')}</div></div><div class="settings-row"><div><strong>Availability</strong><p>${escapeHtml(s.availability||'Confirm in chat')}</p></div><span class="tag gray">Not guaranteed</span></div><p class="subtle" style="font-size:12px">${escapeHtml(s.description||'')}</p><div class="notice warning">Confirm identity, competence, scope, safety, final price and scheduling directly. Verification badges, when implemented, will describe checks and will not guarantee outcomes.</div><div class="modal-actions"><button class="btn" data-report="${s.id}" data-report-target="Service: ${escapeHtml(s.name)}">${I('report')} Report service</button><button class="btn primary" data-message-service="${s.id}">${I('message')} Message provider</button></div>`)}
  function showVerificationInfo(){openModal('Verification requirements','A future production workflow needs an approved policy and provider.',`<div class="activity-list"><div class="activity-item"><div class="activity-dot">${I('file')}</div><div><strong>Define what is checked</strong><p>Differentiate individual identity, business ownership, legal registration and provider qualifications.</p></div></div><div class="activity-item"><div class="activity-dot">${I('lock')}</div><div><strong>Protect sensitive evidence</strong><p>Use private encrypted storage, least-privilege access, documented retention and deletion.</p></div></div><div class="activity-item"><div class="activity-dot">${I('users')}</div><div><strong>Review, appeal and audit</strong><p>Manual review queue, reasoned decisions, correction and appeal path, and sanitized audit trail.</p></div></div></div><div class="notice warning section-gap">This demo cannot verify a person or business. No identity documents, selfies or biometric data are requested.</div><div class="modal-actions"><button class="btn primary" data-action="close-modal">Understood</button></div>`)}
  function reportModal(target,id){openModal('Report a concern',`Report target: ${escapeHtml(target)}`,`<form id="reportForm" data-target="${escapeHtml(target)}" data-id="${escapeHtml(id)}"><div class="form-field"><label>Reason</label><select class="select" name="reason"><option>Suspected scam or fraud</option><option>Impersonation</option><option>Prohibited or unsafe listing</option><option>Harassment or abuse</option><option>Misleading information</option><option>Other concern</option></select></div><div class="form-field" style="margin-top:12px"><label>Additional context (optional)</label><textarea class="field" name="details" maxlength="500" placeholder="Describe the concern without including sensitive information"></textarea></div><div class="notice section-gap">This creates a report record in this browser only. It does not alert a moderation team.</div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">Save demo report</button></div></form>`)}
  function openChat(id,context=''){let chat=state.chats.find(c=>c.id===id);if(!chat){chat={id:uid('chat'),name:'New contact',handle:'new-contact',context:context||'New conversation',unread:0,request:false,blocked:false,muted:false,messages:[]};state.chats.unshift(chat)}if(context)chat.context=context;if(chat.request){toast('Accept the message request before replying.','warn');activePage='connect';selectedChatId='';render();return}chat.unread=0;selectedChatId=chat.id;state.selectedChat=chat.id;activePage='connect';mobileChatOpen=true;saveState();render();closeModal()}
  function beginProductChat(id){const p=state.products.find(x=>x.id===id);if(!p)return;let c=state.chats.find(x=>x.name===p.seller&&!x.request&&!x.blocked);if(!c){c={id:uid('chat'),name:p.seller,handle:p.seller.toLowerCase().replace(/[^a-z0-9]+/g,'-'),context:`Enquiry about: ${p.name}`,unread:0,request:false,blocked:false,muted:false,messages:[]};state.chats.unshift(c)}else c.context=`Enquiry about: ${p.name}`;openChat(c.id,`Enquiry about: ${p.name}`);setTimeout(()=>{const box=$('#page textarea[name="body"]');if(box)box.placeholder=`Ask ${p.seller} about ${p.name}…`},10)}
  function beginServiceChat(id){const s=state.services.find(x=>x.id===id);if(!s)return;let c=state.chats.find(x=>x.name===s.provider&&!x.request&&!x.blocked);if(!c){c={id:uid('chat'),name:s.provider,handle:s.provider.toLowerCase().replace(/[^a-z0-9]+/g,'-'),context:`Service enquiry: ${s.name}`,unread:0,request:false,blocked:false,muted:false,messages:[]};state.chats.unshift(c)}else c.context=`Service enquiry: ${s.name}`;openChat(c.id,`Service enquiry: ${s.name}`)}
  function toggleMore(open){const s=$('#moreSheet');s.classList.toggle('open',open);s.setAttribute('aria-hidden',String(!open));document.body.classList.toggle('more-open',open);if(open){const close=$('[data-action="close-more"]',s);close?.focus({preventScroll:true})}}

  function handleAction(action,el){switch(action){case 'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';saveState();render();break;case 'new-chat':newChatModal();break;case 'new-product':newProductModal();break;case 'new-service':newServiceModal();break;case 'new-business':newBusinessModal();break;case 'new-provider':newProviderModal();break;case 'verification-info':showVerificationInfo();break;case 'close-modal':closeModal();break;case 'more':toggleMore(true);break;case 'close-more':toggleMore(false);break;case 'chat-back':mobileChatOpen=false;render();break;case 'chat-menu':{const c=state.chats.find(x=>x.id===selectedChatId);if(!c)break;openModal('Conversation safety','Controls are stored locally in this prototype.',`<div class="activity-list"><div class="settings-row"><div><strong>Mute conversation</strong><p>Hide notification previews in this demo.</p></div><button class="switch ${c.muted?'on':''}" data-mute="${c.id}"></button></div><div class="settings-row"><div><strong>Block contact</strong><p>Prevent this contact from appearing in the active conversation list.</p></div><button class="btn small danger" data-block="${c.id}">Block</button></div></div><div class="modal-actions"><button class="btn" data-report="${c.id}" data-report-target="${escapeHtml(c.name)}">Report contact</button><button class="btn primary" data-action="close-modal">Close</button></div>`);break;}case 'read-notifications':state.notifications.forEach(n=>n.read=true);saveState();render();toast('Notifications marked as read in this browser.');break;case 'save-profile':$('#profileForm')?.requestSubmit();break;case 'clear-search':globalSearch='';render();break;case 'run-discover':globalSearch=$('#discoverSearch')?.value||'';render();break;case 'run-market':globalSearch=$('#marketSearch')?.value||'';render();break;case 'run-services':globalSearch=$('#serviceSearch')?.value||'';render();break;case 'save-module-interest':toast('Future module noted for this browser session.');closeModal();break;case 'security-info':openModal('Security implementation gates','Required before describing the controls as production security.',`<ul style="padding-left:18px;color:var(--muted);font-size:12px;line-height:1.8"><li>WebAuthn registration and assertion with correct RP ID and origin checks.</li><li>Secure session issuance, revocation and device inventory.</li><li>Recovery threat model with two independent paths and no support bypass.</li><li>Step-up authentication and audit for sensitive operations.</li><li>Independent review of messaging protocol, storage and key lifecycle.</li></ul><div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div>`);break;case 'reset-demo':if(confirm('Reset all locally saved TwinCercle demo data in this browser?')){localStorage.removeItem(STORE_KEY);state=cloneData(SEED);activePage='home';selectedChatId='chat-1';globalSearch='';currentProductFilter='All';currentServiceFilter='All';currentMarketLocation='all';currentServiceArea='all';mobileChatOpen=false;render();toast('Demo data reset.')}break;case 'open-profile':nav('identity');break;}}
  document.addEventListener('click',e=>{const target=e.target.closest('[data-nav],[data-action],[data-product],[data-service],[data-save],[data-chat],[data-message-product],[data-message-service],[data-product-filter],[data-service-filter],[data-accept],[data-decline],[data-pref],[data-mute],[data-block],[data-report]');if(!target)return;if(target.hasAttribute('data-nav')){nav(target.dataset.nav);return}if(target.hasAttribute('data-action')){handleAction(target.dataset.action,target);return}if(target.hasAttribute('data-product')){showProduct(target.dataset.product);return}if(target.hasAttribute('data-service')){showService(target.dataset.service);return}if(target.hasAttribute('data-save')){const id=target.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];saveState();render();toast(state.saved.includes(id)?'Listing saved in this browser.':'Listing removed from saved items.');return}if(target.hasAttribute('data-message-product')){beginProductChat(target.dataset.messageProduct);return}if(target.hasAttribute('data-message-service')){beginServiceChat(target.dataset.messageService);return}if(target.hasAttribute('data-chat')){openChat(target.dataset.chat);return}if(target.hasAttribute('data-product-filter')){currentProductFilter=target.dataset.productFilter;render();return}if(target.hasAttribute('data-service-filter')){currentServiceFilter=target.dataset.serviceFilter;render();return}if(target.hasAttribute('data-accept')){const c=state.chats.find(x=>x.id===target.dataset.accept);if(c){c.request=false;c.context='New connection';selectedChatId=c.id;state.selectedChat=c.id;mobileChatOpen=true;saveState();render();toast('Request accepted in local demo.')}return}if(target.hasAttribute('data-decline')){state.chats=state.chats.filter(x=>x.id!==target.dataset.decline);saveState();render();toast('Request removed from local demo.');return}if(target.hasAttribute('data-pref')){const k=target.dataset.pref;state.preferences[k]=!state.preferences[k];saveState();render();return}if(target.hasAttribute('data-mute')){const c=state.chats.find(x=>x.id===target.dataset.mute);if(c){c.muted=!c.muted;saveState();closeModal();render();toast(c.muted?'Conversation muted locally.':'Conversation unmuted.')}return}if(target.hasAttribute('data-block')){const c=state.chats.find(x=>x.id===target.dataset.block);if(c)c.blocked=true;saveState();closeModal();render();toast('Contact blocked in local demo.');return}if(target.hasAttribute('data-report')){const id=target.dataset.report;const name=target.dataset.reportTarget||state.chats.find(c=>c.id===id)?.name||'Conversation';closeModal();reportModal(name,id);return}});
  document.addEventListener('submit',e=>{const f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());switch(f.id){case 'newChatForm':{const name=(d.name||'').trim();if(!name)return;const c={id:uid('chat'),name,handle:(d.handle||'').trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),context:(d.context||'New conversation').trim(),unread:0,request:false,blocked:false,muted:false,messages:[]};state.chats.unshift(c);saveState();closeModal();openChat(c.id);toast('Demo conversation created locally.');break}case 'productForm':{const p={id:uid('prd'),name:d.name.trim(),category:d.category,price:Number(d.price),currency:d.currency,location:d.location.trim(),seller:state.businessDraft?.name||state.profile.name,sellerId:state.businessDraft?.id||'local-business',delivery:d.delivery.trim()||'Confirm with seller',stock:d.stock,emoji:'📦',tone:'new',description:d.description.trim(),status:'draft',ownerDraft:true};state.products.unshift(p);saveState();closeModal();nav('business');toast('Product draft saved in this browser.');break}case 'serviceForm':{const s={id:uid('srv'),name:d.name.trim(),category:d.category,provider:d.provider.trim(),providerId:state.providerDraft?.id||'local-provider',location:d.location.trim(),coverage:d.coverage.trim()||'Confirm in chat',rate:d.rate.trim()||'Quote in chat',availability:d.availability.trim()||'By arrangement',emoji:'🧰',description:d.description.trim(),status:'draft',ownerDraft:true};state.services.unshift(s);saveState();closeModal();nav('business');toast('Service draft saved in this browser.');break}case 'businessForm':state.businessDraft={id:state.businessDraft?.id||uid('biz'),name:d.name.trim(),category:d.category,location:d.location.trim(),description:d.description.trim(),verification:'Not verified',status:'draft'};saveState();closeModal();nav('business');toast('Business profile draft saved locally.');break;case 'providerForm':state.providerDraft={id:state.providerDraft?.id||uid('prov'),name:d.name.trim(),category:d.category,location:d.location.trim(),description:d.description.trim(),verification:'Not verified',status:'draft'};saveState();closeModal();nav('business');toast('Provider profile draft saved locally.');break;case 'profileForm':{if(!/^[a-zA-Z0-9._-]{2,24}$/.test(d.handle.trim())){toast('Username must be 2–24 characters using letters, numbers, dot, underscore or hyphen.','warn');return}state.profile={...state.profile,name:d.name.trim(),handle:d.handle.trim().toLowerCase(),location:d.location.trim(),bio:d.bio.trim(),email:d.email.trim()};saveState();render();toast('Profile saved in this browser.');break}case 'sendMessageForm':{const c=state.chats.find(x=>x.id===selectedChatId&&!x.request&&!x.blocked);const body=(d.body||'').trim();if(!c||!body)return;c.messages.push({id:uid('msg'),from:'me',body,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});c.unread=0;saveState();render();$('#page textarea[name="body"]')?.focus();break}case 'reportForm':state.reports.unshift({id:uid('report'),target:f.dataset.target,recordId:f.dataset.id,reason:d.reason,details:(d.details||'').trim(),status:'Unreviewed demo report'});saveState();closeModal();toast('Report saved locally. No moderation team was notified.');break}});
  document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){globalSearch=e.target.value}if(e.target.id==='chatSearch'){const q=e.target.value.toLowerCase();$$('.chat-person',$('#connectLayout')).forEach(el=>el.style.display=el.innerText.toLowerCase().includes(q)?'flex':'none')}if(e.target.id==='marketSearch'||e.target.id==='serviceSearch'||e.target.id==='discoverSearch'){globalSearch=e.target.value}});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='globalSearch'){e.preventDefault();globalSearch=e.target.value;nav('discover')}if(e.key==='Enter'&&['marketSearch','serviceSearch','discoverSearch'].includes(e.target.id)){e.preventDefault();globalSearch=e.target.value;render()}if(e.key==='Escape'){closeModal();toggleMore(false)}if(e.key==='Tab'&&$('#modalRoot .modal')){const dialog=$('#modalRoot .modal');const focusables=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]',dialog).filter(el=>el.offsetParent!==null);if(focusables.length){const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-backdrop]');if(b&&e.target===b)closeModal()});
  $('#moreSheet').addEventListener('click',e=>{if(e.target.id==='moreSheet')toggleMore(false)});
  // Delegated controls not tied to a form.
  document.addEventListener('change',e=>{if(e.target.id==='marketLocation'){currentMarketLocation=e.target.value;render()}if(e.target.id==='serviceArea'){currentServiceArea=e.target.value;render()}});
  function init(){activePage=state.active&&pages[state.active]?state.active:'home';state.active=activePage;render();}
  window.addEventListener('beforeunload',()=>{state.active=activePage;saveState()});
  // Keep state transitions explicit and browser-local.
  init();
})();
</script>
